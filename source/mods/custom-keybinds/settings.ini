; Configure Unity InputSystem Key enum names (case-sensitive) or LeftMouse,
; RightMouse, MiddleMouse. None disables keyboard/mouse for that action.
; Omitted actions retain vanilla bindings. Restart or Ctrl+Home to reload.
[bindings]
;Interact=E
;Jump=Space
;Map=M
;Scan=Q
;Use=LeftMouse
;Secondary=RightMouse
;BuildMenu=B
;Remove=Delete

; Shared native mod actions use namespaced IDs and Ctrl/Shift/Alt chords.
; Extra modifiers are allowed unless explicitly forbidden with !Modifier.
; None disables an action. Malformed overrides retain the last valid binding.
; The matching loader exposes the registry; standalone mods retain defaults.
[mod-bindings]
;gambling.wager=Ctrl+G
;item-stacking.stack=!Shift+!Alt+Ctrl+K
;flag-finder.cycle=T
;custom-keybinds.reload=Ctrl+Home
;custom-keybinds.reset=Ctrl+End
